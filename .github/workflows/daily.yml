name: 每日更新處置候選

on:
  schedule:
    - cron: "30 10 * * 1-5"   # UTC 10:30 = 台灣 18:30，平日收盤後（注意股公告約 17:00 後）
  workflow_dispatch:           # 也可手動按 Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - run: python disposal_predictor.py
      - name: 提交 docs/data.json
        run: |
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git commit -m "update $(date +%F)" || echo "no change"
          git push
